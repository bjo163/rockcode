extends:
  - recommended

apis:
  openapi-v1:
    root: contracts/openapi/v1/openapi.yaml
    rules:
      # Keep summaries mandatory; every operation declares an explicit summary.
      operation-summary: error
      # Design D1/D2: a missing 4xx is a finding, not a warning. C2 fails on any
      # severity, so this mainly documents intent; recommended keeps it at warn.
      operation-4xx-response: error
      # Every tag carries a description written from the M0 spec documents.
      tag-description: error
      # info-license stays off for this internal contract; no SPDX licence is declared.
      info-license: off
  asyncapi-v1:
    root: contracts/asyncapi/v1/session-events.yaml
