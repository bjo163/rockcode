name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: arch test
        run: cargo test -p rockcode-arch-tests
      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0
          fallback: none
      - name: deny
        run: cargo deny check
      - name: cargo tree
        run: cargo tree -e features | tee cargo-tree.txt
      - name: upload Rust build evidence and resolved lockfile
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-build-evidence-${{ matrix.os }}
          path: |
            cargo-tree.txt
            Cargo.lock
          if-no-files-found: ignore
