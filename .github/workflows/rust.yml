name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: arch test
        run: cargo test -p rockcode-arch-tests
      - name: deny
        run: cargo deny check || true
      - name: cargo tree
        run: cargo tree -e features | tee cargo-tree.txt
      - name: upload cargo tree
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-tree-${{ matrix.os }}
          path: cargo-tree.txt
          if-no-files-found: ignore
